appId: dev.gramatrix.app
productName: Gramatrix
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
mac:
  # website/public/install.sh downloads these zips by name.
  target: [zip]
  artifactName: ${productName}-mac-${arch}.${ext}
  category: public.app-category.developer-tools
  # There is no Apple Developer certificate yet. Apple Silicon needs at least an ad-hoc signature,
  # and an ad-hoc signed app cannot start with the hardened runtime on.
  identity: '-'
  hardenedRuntime: false
linux:
  target: [deb]
  icon: build/icons
  category: Development
  maintainer: Gramatrix Contributors <berkkaradalan@users.noreply.github.com>
deb:
  # website/public/install.sh downloads this file by name.
  artifactName: gramatrix-linux-amd64.${ext}
